---
name: "Build Containers"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Container tag to publish (defaults to ref name)'
        required: false
        type: string
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build-containers-common:
    runs-on: ubuntu-latest
    outputs:
      containerver: ${{ steps.getcontainerver.outputs.containerver }}
      imagename: ${{ steps.getcontainerver.outputs.imagename }}
    steps:
      - name: Get Container Version
        id: getcontainerver
        run: |
          VER="${{ inputs.tag || github.ref_name }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "containerver=${VER}" >> "$GITHUB_OUTPUT"
          echo "imagename=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

  build-containers:
    needs: build-containers-common
    strategy:
      matrix:
        include:
          - runnertags: ubuntu-latest
            arch: amd64
          - runnertags: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
          IMAGENAME: ${{ needs.build-containers-common.outputs.imagename }}
          NEXT_PUBLIC_VERSION: ${{ needs.build-containers-common.outputs.containerver }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.dev \
            -t ${{ env.IMAGENAME }}:${{ env.CONTAINERVER }}-${{ matrix.arch }} \
            --build-arg NEXT_PUBLIC_VERSION=${{ env.NEXT_PUBLIC_VERSION }} \
            --pull \
            --no-cache \
            --provenance=false --sbom=false \
            --output "type=registry,name=${{ env.IMAGENAME }}:${{ env.CONTAINERVER }}-${{ matrix.arch }}" .

  build-container-manifest:
    needs: [build-containers, build-containers-common]
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Docker Manifest
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
          IMAGENAME: ${{ needs.build-containers-common.outputs.imagename }}
        run: |
          # Verify the architecture images
          echo "Verifying AMD64 image:"
          docker buildx imagetools inspect ${{ env.IMAGENAME }}:${{ env.CONTAINERVER }}-amd64
          
          echo "Verifying ARM64 image:"
          docker buildx imagetools inspect ${{ env.IMAGENAME }}:${{ env.CONTAINERVER }}-arm64
          
          # Create and push multi-arch manifests using buildx imagetools
          docker buildx imagetools create -t ${{ env.IMAGENAME }}:${{ env.CONTAINERVER }} \
            ${{ env.IMAGENAME }}:${{ env.CONTAINERVER }}-amd64 \
            ${{ env.IMAGENAME }}:${{ env.CONTAINERVER }}-arm64

          docker buildx imagetools create -t ${{ env.IMAGENAME }}:latest \
            ${{ env.IMAGENAME }}:${{ env.CONTAINERVER }}-amd64 \
            ${{ env.IMAGENAME }}:${{ env.CONTAINERVER }}-arm64

      - name: Verify Manifest
        env:
          IMAGENAME: ${{ needs.build-containers-common.outputs.imagename }}
        run: |
          docker buildx imagetools inspect ${{ env.IMAGENAME }}:latest
